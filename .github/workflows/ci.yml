name: CI

on:
  push:
    branches:
      - main
      - "feat/v*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python for REUSE and manifest scripts
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install REUSE tool
        run: python -m pip install --upgrade pip reuse

      - name: Lint
        run: make lint

      - name: REUSE compliance
        run: make reuse

      - name: Unit and conformance tests
        run: make test

      - name: Runnable example
        run: make example

      - name: Family manifest check
        if: matrix.node-version == '24'
        run: make family

      - name: Lockstep version check
        if: matrix.node-version == '24'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make lockstep
